<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Fill Planner — compressed air bottle transfer calculator</title>
<meta name="description" content="Plan compressed air bottle filling: cascade (smart) or sequential (dumb) transfers, fill counts and resulting pressures. Runs entirely in your browser.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='2' width='10' height='4' rx='1.5' fill='%2338bdf8'/%3E%3Crect x='8' y='6' width='16' height='24' rx='6' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="13" y="2" width="6" height="4" rx="1.2"/>
      <rect x="8" y="6" width="16" height="24" rx="6"/>
    </svg>
    <div>
      <h1>Gas Fill Planner</h1>
      <p class="tagline" data-i18n="app.tagline">Compressed air transfer &amp; cascade calculator</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="langBtn" class="ghost" type="button" data-i18n-title="btn.lang.title">Deutsch</button>
    <button id="themeBtn" class="ghost" type="button" data-i18n-title="btn.theme.title">Light</button>
    <button id="shareBtn" class="ghost" type="button" data-i18n="btn.share" data-i18n-title="btn.share.title">Copy link</button>
    <button id="resetBtn" class="ghost" type="button" data-i18n="btn.reset" data-i18n-title="btn.reset.title">Reset</button>
  </div>
</header>

<main>
  <section class="controls card">
    <div class="seg" role="radiogroup" data-i18n-aria="method.group" aria-label="Filling method">
      <button type="button" class="seg-btn is-active" data-method="smart" role="radio" aria-checked="true">
        <span class="seg-title" data-i18n="method.smart">Smart</span>
        <span class="seg-sub" data-i18n="method.smart.sub">Cascade — two donors: low pressure first, fullest tops up</span>
      </button>
      <button type="button" class="seg-btn" data-method="dumb" role="radio" aria-checked="false">
        <span class="seg-title" data-i18n="method.dumb">Dumb</span>
        <span class="seg-sub" data-i18n="method.dumb.sub">Sequential — one donor at a time until it falls short</span>
      </button>
    </div>
    <label class="switch" data-i18n-title="unsafe.title">
      <input type="checkbox" id="unsafeChk">
      <span class="switch-track"><span class="switch-knob"></span></span>
      <span class="switch-label" data-i18n="unsafe.label">Allow unsafe filling</span>
    </label>
  </section>

  <div class="columns">
    <section class="card" id="donorCard">
      <div class="card-head">
        <h2 data-i18n="card.donors">Donor bottles</h2>
        <button type="button" class="add" data-add="donor" data-i18n="btn.addDonor">+ Add donor</button>
      </div>
      <div class="bottle-list" id="donorList"></div>
    </section>

    <section class="card" id="recipCard">
      <div class="card-head">
        <h2 data-i18n="card.recipients">Recipient bottles</h2>
        <button type="button" class="add" data-add="recipient" data-i18n="btn.addRecipient">+ Add recipient</button>
      </div>
      <div class="bottle-list" id="recipList"></div>
    </section>
  </div>

  <section class="card" id="planCard">
    <div class="card-head">
      <h2 data-i18n="card.plan">Fill plan</h2>
      <span class="hint" id="methodHint"></span>
    </div>
    <div id="issues" class="issues" hidden></div>
    <div class="stats" id="stats"></div>
    <div id="compare" class="compare"></div>
    <ol class="timeline" id="timeline"></ol>
    <div class="residual">
      <h3 data-i18n="residual.heading">Donor bank when the plan ends</h3>
      <div class="bottle-strip" id="residual"></div>
    </div>
  </section>

  <section class="card notes">
    <h2 data-i18n="notes.heading">How the numbers are produced</h2>
    <ul>
      <li data-i18n-html="notes.model"></li>
      <li data-i18n-html="notes.warm"></li>
      <li data-i18n-html="notes.methods"></li>
      <li data-i18n-html="notes.reading"></li>
      <li data-i18n-html="notes.duty"></li>
      <li data-i18n-html="notes.safety"></li>
    </ul>
    <p class="disclaimer" data-i18n="notes.disclaimer"></p>
  </section>
</main>

<footer>
  <span data-i18n="footer.local">Everything is computed locally in your browser — no data leaves this page.</span>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
